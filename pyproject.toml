[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "holoassist-ai"
version = "0.1.0"
description = "Evidence-grounded technical intelligence for an educational DC motor rig"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "httpx>=0.28,<1"]
ai = ["openai>=2,<3"]
orchestration = ["langgraph>=1,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]
rag = ["chromadb>=1,<2"]
vision = ["opencv-python-headless>=4.10,<5"]
analytics = ["pandas>=2.2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
where = ["ai-engine"]
include = ["holoassist*"]

[tool.setuptools.package-data]
"holoassist.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["ai-engine/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]





