name: holoassist
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: holoassist-api:local
    environment:
      HOLOASSIST_APPROVAL_BACKEND: postgres
      HOLOASSIST_POSTGRES_HOST: postgres
      HOLOASSIST_POSTGRES_PORT: "5432"
      HOLOASSIST_POSTGRES_DATABASE: holoassist
      HOLOASSIST_POSTGRES_USER: holoassist
      HOLOASSIST_POSTGRES_PASSWORD: ${HOLOASSIST_POSTGRES_PASSWORD:?Set HOLOASSIST_POSTGRES_PASSWORD in .env}
      HOLOASSIST_API_OPERATOR_TOKEN: ${HOLOASSIST_API_OPERATOR_TOKEN:-}
      HOLOASSIST_API_REVIEWER_TOKEN: ${HOLOASSIST_API_REVIEWER_TOKEN:-}
    ports:
      - "127.0.0.1:${HOLOASSIST_API_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8).close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: holoassist
      POSTGRES_USER: holoassist
      POSTGRES_PASSWORD: ${HOLOASSIST_POSTGRES_PASSWORD:?Set HOLOASSIST_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${HOLOASSIST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
